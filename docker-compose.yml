# Local development environment.
#
#   docker compose up -d          PostgreSQL + Dagster (webserver, daemon)
#   docker compose run --rm pipeline ingest --from-samples
#   docker compose --profile app up -d   Streamlit viewer
#   docker compose down           stop (keeps the data volume)
#   docker compose down -v        stop and delete the data
#
# Long-running services: the database and the orchestrator (webserver for the
# UI, daemon for schedules and the run queue). The pipeline itself is a batch
# job, not a service: Dagster runs it on schedule, and the `pipeline` service
# exists to run the same image by hand with `docker compose run`.

name: deng

# Shared by the Dagster webserver and daemon: same image, same database, same
# mounts. Differences (command, port, health check) are set per service.
x-orchestrator: &orchestrator
  build:
    context: .
    dockerfile: Dockerfile
    target: orchestrator
  image: deng-orchestrator:local
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:-cl_intelligence}
    POSTGRES_USER: ${POSTGRES_USER:-deng}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
    FOOTBALL_DATA_COMPETITION: ${FOOTBALL_DATA_COMPETITION:-CL}
    INGEST_SOURCE: ${INGEST_SOURCE:-api}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - ./sql:/app/sql:ro
    - ./data/sample:/app/data/sample:ro
  networks: [deng]

services:
  postgres:
    image: postgres:16-alpine
    container_name: deng-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cl_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-deng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Exposed so the host venv, psql and a GUI client can reach the same
      # database the container pipeline writes to.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` alone returns true while the server is still initialising,
      # so the dependent service would start too early. -d/-U make it check the
      # actual database we use.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deng} -d ${POSTGRES_DB:-cl_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [deng]

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit target: without it Compose builds the LAST stage of the
      # Dockerfile, which is the Streamlit image - the pipeline service would
      # then start `streamlit run` instead of `python -m deng.pipeline`.
      target: pipeline
    image: deng-pipeline:local
    depends_on:
      postgres:
        # Wait for the health check, not merely for the container to exist -
        # otherwise the first run fails with "connection refused" on a cold start.
        condition: service_healthy
    environment:
      # Inside the network the database is reachable under its service name,
      # which overrides whatever .env says for host-side use.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cl_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-deng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      FOOTBALL_DATA_COMPETITION: ${FOOTBALL_DATA_COMPETITION:-CL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Read-only mount of the SQL files (schema, transform, verify) so a query
      # change takes effect without rebuilding the image. Application code stays
      # baked in on purpose - the image is what we ship, not a shell around the
      # working copy.
      - ./sql:/app/sql:ro
      # The committed API samples, so `--from-samples` works in the container
      # too. Mounted rather than copied: they are reproducibility fixtures, not
      # part of the image we would ship.
      - ./data/sample:/app/data/sample:ro
    networks: [deng]
    profiles: ["tools"]   # not started by `up`; invoked with `run`

  app:
    # The Streamlit viewer. Reads the curated tables and nothing else - it makes
    # no API calls, which is the architectural point it exists to demonstrate.
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: deng-app:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-cl_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-deng}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./app:/app/app:ro
      - ./sql:/app/sql:ro
    networks: [deng]
    profiles: ["app"]     # started with: docker compose --profile app up -d

  dagster-webserver:
    <<: *orchestrator
    container_name: deng-dagster-webserver
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000",
              "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    healthcheck:
      # No curl in the slim image; Python is there anyway.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:3000/server_info')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  dagster-daemon:
    # Evaluates the schedule and dequeues runs. Without it the UI still works
    # but nothing runs on time - hence its own health check.
    <<: *orchestrator
    container_name: deng-dagster-daemon
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:

networks:
  deng:
    driver: bridge
