# Package definition and tool configuration in one place (PEP 621).
# `pip install -e ".[dev]"` installs the package plus the extras named in [].

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deng"
version = "0.1.0"
description = "Champions League Match Intelligence Data Platform – HSLU DENG HS26 batch data pipeline"
readme = "README.md"
# 3.10 is what Ubuntu 22.04 LTS ships - the oldest interpreter a reviewer is
# likely to have. CI tests 3.10 and 3.12.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Elias Martinelli" },
]
# Three runtime dependencies for the whole pipeline: HTTP, validated settings,
# PostgreSQL. `psycopg[binary]` ships a compiled libpq, so no PostgreSQL client
# libraries have to be installed on the machine.
dependencies = [
  "requests>=2.32",
  "pydantic-settings>=2.5",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]
# Consumers of the data product. Kept out of the core dependencies so the
# pipeline image stays small and a reviewer who only runs the pipeline does not
# install Streamlit and Jupyter.
app = [
  # >=1.64: the version verified in the container; `width="stretch"` replaces the
  # removed `use_container_width`. <2 guards against the next breaking release.
  "streamlit>=1.64,<2",
  "pandas>=2.2",
]
# The orchestrator (ADR-002). Pinned to one minor release because Dagster's
# APIs move quickly between minors; dagster-postgres versions in lockstep.
orchestrator = [
  "dagster>=1.13,<1.14",
  "dagster-webserver>=1.13,<1.14",
  "dagster-postgres>=0.29,<0.30",
]
notebook = [
  "jupyterlab>=4.2",
  "pandas>=2.2",
  "matplotlib>=3.9",
]

# The src/ layout: the package lives in src/deng, so tests import the
# *installed* package, not whatever happens to be in the working directory.
[tool.hatch.build.targets.wheel]
packages = ["src/deng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ruff is linter and formatter in one tool (replaces flake8, isort, black).
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import order, B: bugbear, UP: modern syntax, D: docstrings
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]  # keep the "Google style" docstring conventions

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# Notebooks legitimately set up sys.path before importing project code, and
# their cells are not modules with docstrings.
"notebooks/*" = ["D", "E402"]
"app/*" = ["E402"]
