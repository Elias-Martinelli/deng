<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600"
     role="img" aria-labelledby="title desc">
  <title id="title">Data pipeline architecture of the Champions League Match Intelligence platform</title>
  <desc id="desc">football-data.org and Open-Meteo feed the ingestion step, OpenStreetMap-derived
    venue coordinates feed the transformation. Ingest, transform and quality checks are orchestrated
    by Dagster and write to PostgreSQL (schemas raw, staging, curated, meta). Verification queries,
    the Streamlit viewer and the notebook read from PostgreSQL; the viewer and the notebook read the
    curated schema only.</desc>

  <!-- Colours by role: grey = outside world (sources, consumers), blue = processing
       step, purple = storage and orchestration. Dashed purple = control, not data. -->
  <style>
    .box   { stroke-width: 1.5; }
    .pipe  { fill: #e0f2fe; stroke: #0284c7; }
    .store { fill: #ede9fe; stroke: #7c3aed; }
    .chip  { fill: #f5f3ff; stroke: #a78bfa; }
    .edge  { fill: #f1f5f9; stroke: #64748b; }
    .frame { fill: none; stroke: #7c3aed; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .flow  { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .flow-alt { stroke: #7c3aed; stroke-width: 1.8; fill: none;
                stroke-dasharray: 5 4; marker-end: url(#arrow-alt); }
    text   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
             fill: #0f172a; }
    .h     { font-size: 15px; font-weight: 650; }
    .s     { font-size: 12px; fill: #475569; }
    .lbl   { font-size: 11.5px; fill: #475569; font-style: italic; }
    .num   { font-size: 12px; font-weight: 700; fill: #0284c7; }
    .foot  { font-size: 12px; fill: #475569; }

    @media (prefers-color-scheme: dark) {
      .pipe  { fill: #082f49; stroke: #38bdf8; }
      .store { fill: #2e1065; stroke: #a78bfa; }
      .chip  { fill: #3b0764; stroke: #c4b5fd; }
      .edge  { fill: #1e293b; stroke: #94a3b8; }
      .frame { stroke: #a78bfa; }
      .flow  { stroke: #94a3b8; }
      .flow-alt { stroke: #a78bfa; }
      text   { fill: #e2e8f0; }
      .s, .lbl, .foot { fill: #94a3b8; }
      .num   { fill: #38bdf8; }
      #arrow path     { fill: #94a3b8; }
      #arrow-alt path { fill: #a78bfa; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Row 1: sources -->
  <rect class="box edge" x="24"  y="20" width="220" height="70" rx="10"/>
  <text class="h" x="134" y="46" text-anchor="middle">football-data.org</text>
  <text class="s" x="134" y="66" text-anchor="middle">fixtures · results · teams</text>
  <text class="s" x="134" y="81" text-anchor="middle">free tier, 10 requests/min</text>

  <rect class="box edge" x="274" y="20" width="220" height="70" rx="10"/>
  <text class="h" x="384" y="46" text-anchor="middle">Open-Meteo</text>
  <text class="s" x="384" y="66" text-anchor="middle">hourly weather forecast</text>
  <text class="s" x="384" y="81" text-anchor="middle">up to 16 days ahead</text>

  <rect class="box edge" x="524" y="20" width="220" height="70" rx="10"/>
  <text class="h" x="634" y="46" text-anchor="middle">OpenStreetMap</text>
  <text class="s" x="634" y="66" text-anchor="middle">stadium coordinates</text>
  <text class="s" x="634" y="81" text-anchor="middle">venues.csv, once a season</text>

  <!-- Row 2: processing, inside the Dagster frame -->
  <rect class="frame" x="12" y="148" width="746" height="104" rx="14"/>

  <rect class="box pipe" x="24"  y="160" width="220" height="80" rx="10"/>
  <text class="num" x="40" y="182">1</text>
  <text class="h" x="134" y="186" text-anchor="middle">Ingest</text>
  <text class="s" x="134" y="206" text-anchor="middle">football · weather · crests</text>
  <text class="s" x="134" y="224" text-anchor="middle">idempotent upsert per day</text>

  <rect class="box pipe" x="274" y="160" width="220" height="80" rx="10"/>
  <text class="num" x="290" y="182">2</text>
  <text class="h" x="384" y="186" text-anchor="middle">Transform</text>
  <text class="s" x="384" y="206" text-anchor="middle">SQL, one transaction</text>
  <text class="s" x="384" y="224" text-anchor="middle">raw → staging → curated</text>

  <rect class="box pipe" x="524" y="160" width="220" height="80" rx="10"/>
  <text class="num" x="540" y="182">3</text>
  <text class="h" x="634" y="186" text-anchor="middle">Quality checks</text>
  <text class="s" x="634" y="206" text-anchor="middle">18 checks, results stored</text>
  <text class="s" x="634" y="224" text-anchor="middle">CRITICAL fails the run</text>

  <!-- Orchestrator -->
  <rect class="box store" x="800" y="160" width="140" height="80" rx="10"/>
  <text class="h" x="870" y="186" text-anchor="middle">Dagster</text>
  <text class="s" x="870" y="206" text-anchor="middle">daily 06:00 · retries</text>
  <text class="s" x="870" y="224" text-anchor="middle">partitions · backfills</text>
  <path class="flow-alt" d="M800,200 L760,200"/>
  <text class="lbl" x="780" y="190" text-anchor="middle">runs</text>

  <!-- Source arrows -->
  <path class="flow" d="M134,90 L134,158"/>
  <text class="lbl" x="142" y="128">fetch daily</text>
  <path class="flow" d="M330,90 L222,158"/>
  <text class="lbl" x="288" y="136">forecast</text>
  <path class="flow" d="M580,90 L466,158"/>
  <text class="lbl" x="530" y="136">reference</text>

  <!-- Step order -->
  <path class="flow" d="M244,200 L272,200"/>
  <path class="flow" d="M494,200 L522,200"/>

  <!-- Row 3: storage -->
  <rect class="box store" x="24" y="300" width="720" height="112" rx="10"/>
  <text class="h" x="40" y="324">PostgreSQL</text>
  <text class="s" x="148" y="324">· four schemas in one database</text>

  <rect class="box chip" x="40"  y="336" width="188" height="62" rx="8"/>
  <text class="h" x="134" y="360" text-anchor="middle">raw</text>
  <text class="s" x="134" y="380" text-anchor="middle">API answers, unchanged</text>

  <rect class="box chip" x="244" y="336" width="130" height="62" rx="8"/>
  <text class="h" x="309" y="360" text-anchor="middle">staging</text>
  <text class="s" x="309" y="380" text-anchor="middle">typed tables</text>

  <rect class="box chip" x="394" y="336" width="130" height="62" rx="8"/>
  <text class="h" x="459" y="360" text-anchor="middle">curated</text>
  <text class="s" x="459" y="380" text-anchor="middle">facts, dimensions</text>

  <rect class="box chip" x="540" y="336" width="188" height="62" rx="8"/>
  <text class="h" x="634" y="360" text-anchor="middle">meta</text>
  <text class="s" x="634" y="380" text-anchor="middle">run log, check results</text>

  <!-- Writes into storage -->
  <path class="flow" d="M134,240 L134,298"/>
  <text class="lbl" x="142" y="282">write raw</text>
  <path class="flow" d="M384,240 L384,298"/>
  <text class="lbl" x="392" y="282">build staging, curated</text>
  <path class="flow" d="M634,240 L634,298"/>
  <text class="lbl" x="642" y="282">store results</text>

  <!-- Docker Compose note -->
  <rect class="box edge" x="774" y="300" width="166" height="112" rx="10"/>
  <text class="h" x="857" y="326" text-anchor="middle">Docker Compose</text>
  <text class="s" x="857" y="348" text-anchor="middle">postgres · dagster</text>
  <text class="s" x="857" y="366" text-anchor="middle">viewer · one network</text>
  <text class="s" x="857" y="384" text-anchor="middle">make up / orchestrator</text>

  <!-- Row 4: consumers -->
  <rect class="box edge" x="24"  y="470" width="220" height="62" rx="10"/>
  <text class="h" x="134" y="496" text-anchor="middle">Verification queries</text>
  <text class="s" x="134" y="516" text-anchor="middle">make verify</text>

  <rect class="box edge" x="274" y="470" width="220" height="62" rx="10"/>
  <text class="h" x="384" y="496" text-anchor="middle">Streamlit viewer</text>
  <text class="s" x="384" y="516" text-anchor="middle">web · iPhone · Android</text>

  <rect class="box edge" x="524" y="470" width="220" height="62" rx="10"/>
  <text class="h" x="634" y="496" text-anchor="middle">Notebook</text>
  <text class="s" x="634" y="516" text-anchor="middle">exploration, leakage check</text>

  <path class="flow" d="M134,412 L134,468"/>
  <text class="lbl" x="142" y="446">read raw, meta</text>
  <path class="flow" d="M440,412 L404,468"/>
  <path class="flow" d="M490,412 L600,468"/>
  <text class="lbl" x="478" y="446" text-anchor="middle">curated only</text>

  <text class="foot" x="24" y="566">Local stack for the midterm. Final milestone: the raw zone moves to Google Cloud Storage</text>
  <text class="foot" x="24" y="584">and the curated tables to BigQuery, provisioned with Terraform.</text>
</svg>
