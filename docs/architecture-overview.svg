<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"
     role="img" aria-labelledby="title desc">
  <title id="title">The three stages of the Champions League match data pipeline</title>
  <desc id="desc">Four live sources feed stage one, ingest, which stores every answer unchanged in
    the raw zone. Stage two, transform, builds staging and curated tables with SQL. Stage three is
    the data product: curated tables read by the analysis dashboard and later by a model. Dagster
    runs the stages daily and records every run.</desc>

  <style>
    .box   { stroke-width: 1.5; }
    .stage { fill: #0f172a; stroke: #0f172a; }
    .store { fill: #ede9fe; stroke: #7c3aed; }
    .edge  { fill: #f1f5f9; stroke: #64748b; }
    .flow  { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .ctrl  { stroke: #7c3aed; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4;
             marker-end: url(#arrow-alt); }
    text   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
             fill: #0f172a; }
    .h     { font-size: 16px; font-weight: 700; }
    .on    { fill: #ffffff; }
    .s     { font-size: 12px; fill: #475569; }
    .son   { font-size: 12px; fill: #cbd5e1; }
    .lbl   { font-size: 11.5px; fill: #475569; font-style: italic; }
    .num   { font-size: 13px; font-weight: 700; fill: #7dd3fc; }
    .cap   { font-size: 12.5px; fill: #475569; }

    @media (prefers-color-scheme: dark) {
      .stage { fill: #1e293b; stroke: #64748b; }
      .store { fill: #2e1065; stroke: #a78bfa; }
      .edge  { fill: #1e293b; stroke: #94a3b8; }
      .flow  { stroke: #94a3b8; }
      .ctrl  { stroke: #a78bfa; }
      text   { fill: #e2e8f0; }
      .s, .lbl, .cap { fill: #94a3b8; }
      #arrow path     { fill: #94a3b8; }
      #arrow-alt path { fill: #a78bfa; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Sources -->
  <rect class="box edge" x="20" y="96" width="150" height="96" rx="10" stroke-dasharray="6 4"/>
  <text class="h" x="95" y="124" text-anchor="middle">Live sources</text>
  <text class="s" x="95" y="146" text-anchor="middle">football · weather</text>
  <text class="s" x="95" y="164" text-anchor="middle">odds · stadiums</text>
  <text class="s" x="95" y="182" text-anchor="middle">4 public APIs</text>

  <!-- Stage boxes -->
  <text class="lbl" x="290" y="76" text-anchor="middle">daily 06:00 · backfill</text>
  <rect class="box stage" x="200" y="88" width="180" height="80" rx="10"/>
  <text class="num" x="218" y="114">1</text>
  <text class="h on" x="290" y="124" text-anchor="middle">Ingest</text>
  <text class="son" x="290" y="148" text-anchor="middle">store answers unchanged</text>

  <text class="lbl" x="530" y="76" text-anchor="middle">after ingest, one transaction</text>
  <rect class="box stage" x="440" y="88" width="180" height="80" rx="10"/>
  <text class="num" x="458" y="114">2</text>
  <text class="h on" x="530" y="124" text-anchor="middle">Transform</text>
  <text class="son" x="530" y="148" text-anchor="middle">SQL only</text>

  <text class="lbl" x="770" y="76" text-anchor="middle">read by people and models</text>
  <rect class="box stage" x="680" y="88" width="180" height="80" rx="10"/>
  <text class="num" x="698" y="114">3</text>
  <text class="h on" x="770" y="124" text-anchor="middle">Data product</text>
  <text class="son" x="770" y="148" text-anchor="middle">curated tables</text>

  <!-- Stores -->
  <rect class="box store" x="200" y="236" width="180" height="74" rx="10"/>
  <text class="h" x="290" y="264" text-anchor="middle">Raw zone</text>
  <text class="s" x="290" y="286" text-anchor="middle">every answer, as received</text>

  <rect class="box store" x="440" y="236" width="180" height="74" rx="10"/>
  <text class="h" x="530" y="264" text-anchor="middle">Staging · Curated</text>
  <text class="s" x="530" y="286" text-anchor="middle">typed tables, facts</text>

  <rect class="box edge" x="680" y="236" width="180" height="74" rx="10"/>
  <text class="h" x="770" y="264" text-anchor="middle">Dashboard · Model</text>
  <text class="s" x="770" y="286" text-anchor="middle">analysis, later training</text>

  <!-- Flows -->
  <path class="flow" d="M170,128 L198,128"/>
  <path class="flow" d="M380,128 L438,128"/>
  <path class="flow" d="M620,128 L678,128"/>
  <path class="flow" d="M290,168 L290,234"/>
  <text class="lbl" x="298" y="212">write</text>
  <path class="flow" d="M330,236 L465,172"/>
  <text class="lbl" x="372" y="212">read</text>
  <path class="flow" d="M530,168 L530,234"/>
  <text class="lbl" x="538" y="212">write</text>
  <path class="flow" d="M620,270 L678,270"/>
  <text class="lbl" x="628" y="258">read</text>

  <!-- Orchestrator -->
  <rect class="box store" x="20" y="236" width="150" height="74" rx="10"/>
  <text class="h" x="95" y="264" text-anchor="middle">Dagster</text>
  <text class="s" x="95" y="286" text-anchor="middle">schedule · retries</text>
  <path class="ctrl" d="M170,268 L186,268 L186,150 L198,134"/>

  <!-- Captions -->
  <text class="cap" x="20" y="366">1 · Ingest</text>
  <text class="s" x="20" y="388">Asks each source, stores the answer</text>
  <text class="s" x="20" y="406">unchanged: one row per source, question</text>
  <text class="s" x="20" y="424">and day. A rerun overwrites that row.</text>

  <text class="cap" x="360" y="366">2 · Transform</text>
  <text class="s" x="360" y="388">Numbered SQL files, in order, in one</text>
  <text class="s" x="360" y="406">transaction. Features use only what was</text>
  <text class="s" x="360" y="424">known before the kick-off they describe.</text>

  <text class="cap" x="700" y="366">3 · Data product</text>
  <text class="s" x="700" y="388">One row per match, and per team in a match.</text>
  <text class="s" x="700" y="406">Read by the dashboard today and by a</text>
  <text class="s" x="700" y="424">match-outcome model later.</text>
</svg>
