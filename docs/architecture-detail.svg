<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"
     role="img" aria-labelledby="title desc">
  <title id="title">Sources, ingestion, warehouse, transformation and data product</title>
  <desc id="desc">Four sources - football-data.org, Open-Meteo, The Odds API and OpenStreetMap -
    are read by one Python ingestion that writes the raw schema. The warehouse holds raw, staging
    and curated schemas in PostgreSQL locally and BigQuery in the final milestone. SQL
    transformations read raw and write staging and curated. The data product is read from curated
    only.</desc>

  <style>
    .box    { stroke-width: 1.5; }
    .src    { fill: #f1f5f9; stroke: #64748b; }
    .py     { fill: #e0f2fe; stroke: #0284c7; }
    .sql    { fill: #e0f2fe; stroke: #0284c7; }
    .ware   { fill: none; stroke: #7c3aed; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .schema { fill: #ede9fe; stroke: #a78bfa; }
    .db     { fill: #ecfdf5; stroke: #0f9d76; }
    .dev    { fill: #fffbeb; stroke: #b45309; stroke-dasharray: 5 3; }
    .out    { fill: #ecfdf5; stroke: #0f9d76; }
    .flow   { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .thin   { stroke: #94a3b8; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3;
              marker-end: url(#arrow-thin); }
    text    { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
              fill: #0f172a; }
    .h      { font-size: 14px; font-weight: 650; }
    .s      { font-size: 11.5px; fill: #475569; }
    .lbl    { font-size: 11px; fill: #475569; font-style: italic; }
    .group  { font-size: 12px; font-weight: 650; fill: #475569; letter-spacing: .04em; }

    @media (prefers-color-scheme: dark) {
      .src    { fill: #1e293b; stroke: #94a3b8; }
      .py, .sql { fill: #082f49; stroke: #38bdf8; }
      .ware   { stroke: #a78bfa; }
      .schema { fill: #3b0764; stroke: #c4b5fd; }
      .db     { fill: #052e26; stroke: #34d399; }
      .dev    { fill: #2a1f05; stroke: #f59e0b; }
      .out    { fill: #052e26; stroke: #34d399; }
      .flow   { stroke: #94a3b8; }
      text    { fill: #e2e8f0; }
      .s, .lbl, .group { fill: #94a3b8; }
      #arrow path      { fill: #94a3b8; }
      #arrow-thin path { fill: #94a3b8; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Sources -->
  <text class="group" x="24" y="36">DATA SOURCES</text>
  <rect class="box src" x="24" y="48" width="196" height="64" rx="10"/>
  <text class="h" x="122" y="72" text-anchor="middle">football-data.org</text>
  <text class="s" x="122" y="92" text-anchor="middle">fixtures · results · teams</text>
  <text class="s" x="122" y="106" text-anchor="middle">standings · crest images</text>

  <rect class="box src" x="24" y="128" width="196" height="54" rx="10"/>
  <text class="h" x="122" y="152" text-anchor="middle">Open-Meteo</text>
  <text class="s" x="122" y="171" text-anchor="middle">hourly forecast, 16 days</text>

  <rect class="box src" x="24" y="198" width="196" height="54" rx="10"/>
  <text class="h" x="122" y="222" text-anchor="middle">The Odds API</text>
  <text class="s" x="122" y="241" text-anchor="middle">1X2 odds, ~25 bookmakers</text>

  <rect class="box src" x="24" y="268" width="196" height="54" rx="10"/>
  <text class="h" x="122" y="292" text-anchor="middle">OpenStreetMap</text>
  <text class="s" x="122" y="311" text-anchor="middle">stadium coordinates</text>

  <!-- Ingestion -->
  <rect class="box py" x="272" y="150" width="150" height="86" rx="10"/>
  <text class="h" x="347" y="178" text-anchor="middle">Ingestion</text>
  <text class="s" x="347" y="198" text-anchor="middle">Python, one file</text>
  <text class="s" x="347" y="214" text-anchor="middle">per source</text>
  <text class="s" x="347" y="230" text-anchor="middle">idempotent per day</text>

  <path class="flow" d="M220,80 L270,168"/>
  <path class="flow" d="M220,155 L270,180"/>
  <path class="flow" d="M220,225 L270,205"/>
  <path class="flow" d="M220,295 L270,220"/>

  <!-- Warehouse -->
  <rect class="ware" x="470" y="40" width="270" height="330" rx="14"/>
  <text class="group" x="605" y="66" text-anchor="middle">WAREHOUSE</text>

  <rect class="box schema" x="496" y="84" width="218" height="52" rx="8"/>
  <text class="h" x="605" y="106" text-anchor="middle">raw</text>
  <text class="s" x="605" y="125" text-anchor="middle">answers as received (JSON)</text>

  <rect class="box schema" x="496" y="148" width="218" height="52" rx="8"/>
  <text class="h" x="605" y="170" text-anchor="middle">staging</text>
  <text class="s" x="605" y="189" text-anchor="middle">typed, flattened tables</text>

  <rect class="box schema" x="496" y="212" width="218" height="52" rx="8"/>
  <text class="h" x="605" y="234" text-anchor="middle">curated</text>
  <text class="s" x="605" y="253" text-anchor="middle">facts and dimensions</text>

  <rect class="box dev" x="496" y="288" width="104" height="62" rx="8"/>
  <text class="h" x="548" y="312" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="548" y="330" text-anchor="middle">local · today</text>

  <rect class="box db" x="610" y="288" width="104" height="62" rx="8"/>
  <text class="h" x="662" y="312" text-anchor="middle">BigQuery</text>
  <text class="s" x="662" y="330" text-anchor="middle">cloud · final</text>

  <path class="thin" d="M560,264 L552,286"/>
  <path class="thin" d="M650,264 L658,286"/>

  <path class="flow" d="M422,186 L494,110"/>
  <text class="lbl" x="432" y="140">write raw</text>

  <!-- Transformation -->
  <rect class="box sql" x="790" y="120" width="180" height="86" rx="10"/>
  <text class="h" x="880" y="148" text-anchor="middle">Transformation</text>
  <text class="s" x="880" y="168" text-anchor="middle">numbered SQL files</text>
  <text class="s" x="880" y="184" text-anchor="middle">one transaction</text>
  <text class="s" x="880" y="200" text-anchor="middle">point-in-time correct</text>

  <path class="flow" d="M716,110 L788,144"/>
  <text class="lbl" x="722" y="122">read raw</text>
  <path class="flow" d="M788,186 L716,200"/>
  <text class="lbl" x="722" y="212">write staging · curated</text>

  <!-- Data product -->
  <rect class="box out" x="790" y="246" width="180" height="86" rx="10"/>
  <text class="h" x="880" y="274" text-anchor="middle">Data product</text>
  <text class="s" x="880" y="294" text-anchor="middle">analysis dashboard</text>
  <text class="s" x="880" y="310" text-anchor="middle">model training data</text>
  <text class="s" x="880" y="326" text-anchor="middle">verification queries</text>

  <path class="flow" d="M716,240 L788,276"/>
  <text class="lbl" x="722" y="262">curated only</text>

  <!-- Platform row -->
  <rect class="box py" x="272" y="412" width="196" height="62" rx="10"/>
  <text class="h" x="370" y="436" text-anchor="middle">Dagster</text>
  <text class="s" x="370" y="455" text-anchor="middle">daily 06:00 · retries · backfills</text>

  <rect class="box src" x="496" y="412" width="218" height="62" rx="10"/>
  <text class="h" x="605" y="436" text-anchor="middle">Docker Compose</text>
  <text class="s" x="605" y="455" text-anchor="middle">database · orchestrator · app</text>

  <rect class="box src" x="742" y="412" width="228" height="62" rx="10"/>
  <text class="h" x="856" y="436" text-anchor="middle">meta schema</text>
  <text class="s" x="856" y="455" text-anchor="middle">run log · data-quality results</text>

  <path class="thin" d="M370,412 L347,240"/>
  <path class="thin" d="M420,430 L560,372"/>
  <path class="thin" d="M420,418 L836,330"/>

  <text class="s" x="24" y="506">Solid arrows: data. Dashed: the platform that runs, stores or records the work.</text>
  <text class="s" x="24" y="526">Everything left of the warehouse is Python; everything right of it is SQL.</text>
  <text class="s" x="24" y="546">Local today (PostgreSQL in Docker Compose), the same shape in BigQuery for the final milestone.</text>
</svg>
