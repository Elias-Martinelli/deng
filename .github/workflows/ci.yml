# Continuous integration: every pull request and every push to main is linted
# and tested on a fresh machine. "Works on my laptop" is not evidence; a green
# run here is - and it is the closest thing to a peer reviewer's clean clone.

name: CI

on:
  push:
    branches: [main]
  pull_request:   # any PR, whatever its target branch (stacked PRs included)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Let both Python versions finish even if one fails, to see whether a
      # failure is version-specific.
      fail-fast: false
      matrix:
        # Lowest supported version (Ubuntu 22.04 LTS default) and a current one.
        # Peer reviewers run whatever their distribution ships, so both must pass.
        python-version: ["3.10", "3.12"]

    services:
      # A real PostgreSQL so the integration tests actually run in CI instead of
      # skipping. Same major version as docker-compose.yml.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cl_intelligence
          POSTGRES_USER: deng
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deng -d cl_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: cl_intelligence
      POSTGRES_USER: deng
      POSTGRES_PASSWORD: ci-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # The orchestrator extra too, so the Dagster definitions are loaded and
        # tested in CI instead of being skipped.
        run: pip install -e ".[dev,orchestrator]"

      - name: Lint
        # `format --check` fails on unformatted code instead of fixing it: CI
        # reports, it never changes the code it is judging.
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Apply schema
        run: python -m deng.pipeline init

      - name: Test
        # `python -m pytest` rather than bare `pytest`: identical to what the
        # Makefile runs, so a green local run means a green CI run.
        run: python -m pytest -v

      # End-to-end on the real database service: the same commands a reviewer
      # runs, including the idempotency claim (second ingest, same result).
      - name: Pipeline smoke test (ingest twice, must stay idempotent)
        run: |
          python -m deng.pipeline ingest --date 2026-09-20 --from-samples
          python -m deng.pipeline ingest --date 2026-09-20 --from-samples
          python -m deng.pipeline transform --date 2026-09-20
          python -m deng.pipeline verify
